<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Elevation Hair - 217 Glebe Point Rd, Glebe NSW 2037. Call (02) 9660 4632 or email elevationhair@gmail.com.">
  <title>Contact | Elevation Hair</title>
  <link rel="icon" href="images/favicon.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header class="site-header">
    <div class="header-top">
      <a href="index.html" class="header-logo">
        <img src="images/logo.png" alt="Elevation Hair logo" width="286" height="40">
      </a>
      <a href="contact.html" class="btn-contact">Get In Touch</a>
    </div>

    <nav class="header-nav">
      <ul class="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="price-list.html">Price list</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
      <div class="header-contact">
        <a href="mailto:elevationhair@gmail.com">elevationhair@gmail.com</a>
        <span>(02) 9660 4632</span>
        <div class="social-bar">
          <a href="https://maps.google.com/?cid=3767804597546806311" target="_blank" rel="noopener" aria-label="Google Places">
            <img src="images/icon-google.png" alt="Google Places">
          </a>
          <a href="https://www.instagram.com/elevationhair" target="_blank" rel="noopener" aria-label="Instagram">
            <img src="images/icon-instagram.png" alt="Instagram">
          </a>
          <a href="https://www.facebook.com/ElevationHair/" target="_blank" rel="noopener" aria-label="Facebook">
            <img src="images/icon-facebook.png" alt="Facebook">
          </a>
        </div>
      </div>
    </nav>

    <div class="header-subbar"></div>
  </header>

  <!-- ========== CONTACT ========== -->
  <section class="contact-section">
    <div class="contact-inner">
      <div class="contact-info">
        <h2>Contact Us</h2>
        <p>217 Glebe Point Rd, Glebe NSW 2037, Australia</p>
        <p><a href="mailto:elevationhair@gmail.com">elevationhair@gmail.com</a></p>
        <p>(02) 9660 4632</p>
      </div>
      <div class="contact-form">
        <form action="https://formsubmit.co/jimmy.halstead@gmail.com" method="POST">
          <input type="hidden" name="_subject" value="New enquiry from Elevation Hair website">
          <input type="hidden" name="_next" value="https://www.elevationhair.com.au/contact">
          <input type="hidden" name="_captcha" value="true">
          <input type="text" name="_honey" style="display:none">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required maxlength="100">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required maxlength="250">
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" maxlength="50">
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="Type the subject">
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Type your message here..."></textarea>
          </div>
          <button type="submit" class="btn-submit">Submit</button>
        </form>
      </div>
    </div>
  </section>

  <!-- ========== MAP ========== -->
  <section class="map-section">
    <iframe
      title="Google Maps - Elevation Hair"
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3312.5!2d151.1825!3d-33.8795!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6b12b0339e7f8f3b%3A0x3446d97ab4d8a027!2s217%20Glebe%20Point%20Rd%2C%20Glebe%20NSW%202037%2C%20Australia!5e0!3m2!1sen!2sau!4v1"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </section>

  <!-- ========== FOOTER ========== -->
  <footer class="site-footer">
    <p>&copy;2026 by Elevation Hair</p>
  </footer>


</body>
</html>
